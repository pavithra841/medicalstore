apiVersion: apps/v1
kind: Deployment
metadata:
  name: medistore-v2
  labels:
    app: medistore
    version: v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medistore
      version: v2
  template:
    metadata:
      labels:
        app: medistore
        version: v2
    spec:
      containers:
      - name: medistore-v2
        image: 23mis0160/medistore:v2
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: medistore-v2-service
spec:
  type: NodePort
  selector:
    app: medistore
    version: v2
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30082