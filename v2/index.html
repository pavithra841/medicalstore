<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MediStore v2 — Update Stock</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #1a5fa8; --blue-light: #e8f0fb; --blue-dark: #0f3d6e;
      --accent: #f0a500; --bg: #f5f7fc; --white: #ffffff;
      --text: #1a2540; --muted: #6b7a9a; --border: #ccd6ee;
      --green: #1a7a4a; --red: #c0392b; --orange: #e67e22;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header {
      background: var(--blue); color: white; padding: 18px 32px;
      display: flex; align-items: center; gap: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    header .logo { font-family: 'DM Serif Display', serif; font-size: 1.7rem; }
    header .version-badge {
      background: var(--accent); color: #1a2540; font-size: 0.75rem;
      font-weight: 600; padding: 3px 10px; border-radius: 20px; margin-left: auto;
    }
    header .subtitle { font-size: 0.9rem; opacity: 0.85; }
    .container { max-width: 750px; margin: 40px auto; padding: 0 20px; }
    h2 { font-family: 'DM Serif Display', serif; font-size: 1.6rem; color: var(--blue-dark); margin-bottom: 20px; }
    .search-bar {
      display: flex; gap: 10px; margin-bottom: 24px;
    }
    .search-bar input {
      flex: 1; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 12px 16px; font-size: 0.95rem; font-family: 'DM Sans', sans-serif;
      background: white; outline: none; color: var(--text);
    }
    .search-bar input:focus { border-color: var(--blue); }
    .search-bar button {
      background: var(--blue); color: white; border: none; border-radius: 8px;
      padding: 12px 20px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif;
    }
    .med-card {
      background: white; border: 1px solid var(--border); border-radius: 14px;
      padding: 22px 24px; margin-bottom: 14px;
      box-shadow: 0 2px 10px rgba(26,95,168,0.06);
    }
    .med-card .top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .med-card .name { font-weight: 600; font-size: 1.05rem; }
    .med-card .meta { color: var(--muted); font-size: 0.82rem; margin-top: 3px; }
    .badge {
      font-size: 0.75rem; font-weight: 600; padding: 4px 10px;
      border-radius: 20px; white-space: nowrap;
    }
    .badge.in-stock { background: #e8f5ee; color: #1a7a4a; }
    .badge.low-stock { background: #fff3e0; color: #e67e22; }
    .badge.out-of-stock { background: #fdecea; color: #c0392b; }
    .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .qty-display {
      font-size: 1.1rem; font-weight: 600; color: var(--blue-dark);
      min-width: 80px; text-align: center;
    }
    .qty-input {
      border: 1.5px solid var(--border); border-radius: 7px;
      padding: 8px 12px; width: 90px; font-size: 0.9rem;
      font-family: 'DM Sans', sans-serif; outline: none;
    }
    .qty-input:focus { border-color: var(--blue); }
    .ctrl-btn {
      border: none; border-radius: 7px; padding: 9px 16px;
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
      font-family: 'DM Sans', sans-serif; transition: opacity 0.2s;
    }
    .ctrl-btn:hover { opacity: 0.85; }
    .set-btn { background: var(--blue); color: white; }
    .add-btn { background: var(--green); color: white; }
    .rem-btn { background: var(--red); color: white; }
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--blue); color: white; padding: 14px 22px;
      border-radius: 10px; font-weight: 500; display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15); animation: slideUp 0.3s ease;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .empty { color: var(--muted); text-align: center; padding: 40px; font-size: 0.95rem; }
  </style>
</head>
<body>
<header>
  <div>
    <div class="logo">🏥 MediStore</div>
    <div class="subtitle">Medical Store Management</div>
  </div>
  <div class="version-badge">v2 — Update Stock</div>
</header>

<div class="container">
  <h2>Update Stock</h2>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search medicine by name or category..." oninput="renderList()"/>
    <button onclick="renderList()">Search</button>
  </div>
  <div id="medList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  function getInventory() { return JSON.parse(localStorage.getItem('medistore_inventory') || '[]'); }
  function saveInventory(data) { localStorage.setItem('medistore_inventory', JSON.stringify(data)); }

  function getBadge(qty) {
    if (qty === 0) return '<span class="badge out-of-stock">Out of Stock</span>';
    if (qty <= 10) return '<span class="badge low-stock">Low Stock</span>';
    return '<span class="badge in-stock">In Stock</span>';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2500);
  }

  function updateQty(id, mode) {
    const inv = getInventory();
    const idx = inv.findIndex(m => m.id === id);
    if (idx === -1) return;
    const val = parseInt(document.getElementById('input_' + id).value);
    if (isNaN(val) || val < 0) { showToast('⚠️ Enter a valid number'); return; }
    if (mode === 'set') inv[idx].qty = val;
    else if (mode === 'add') inv[idx].qty += val;
    else if (mode === 'remove') {
      if (inv[idx].qty < val) { showToast('⚠️ Not enough stock to remove'); return; }
      inv[idx].qty -= val;
    }
    saveInventory(inv);
    showToast('✅ ' + inv[idx].name + ' updated to ' + inv[idx].qty + ' units');
    renderList();
  }

  function renderList() {
    const inv = getInventory();
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = q ? inv.filter(m => m.name.toLowerCase().includes(q) || m.category.toLowerCase().includes(q)) : inv;
    const el = document.getElementById('medList');
    if (!filtered.length) {
      el.innerHTML = '<div class="empty">' + (q ? 'No medicines match your search.' : 'No medicines in inventory. Add some in v1 first!') + '</div>';
      return;
    }
    el.innerHTML = filtered.map(m => `
      <div class="med-card">
        <div class="top">
          <div>
            <div class="name">${m.name}</div>
            <div class="meta">${m.category} · Batch: ${m.batch} · Exp: ${m.expiry} · ₹${m.price.toFixed(2)}</div>
          </div>
          ${getBadge(m.qty)}
        </div>
        <div class="controls">
          <div class="qty-display">Qty: ${m.qty}</div>
          <input class="qty-input" type="number" id="input_${m.id}" placeholder="Amount" min="0"/>
          <button class="ctrl-btn set-btn" onclick="updateQty(${m.id},'set')">Set</button>
          <button class="ctrl-btn add-btn" onclick="updateQty(${m.id},'add')">+ Add</button>
          <button class="ctrl-btn rem-btn" onclick="updateQty(${m.id},'remove')">− Remove</button>
        </div>
      </div>`).join('');
  }
  renderList();
</script>
</body>
</html>
